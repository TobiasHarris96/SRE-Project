apiVersion: v1
kind: Service
metadata:
  name: sre-demo-service
  namespace: sre-project
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "5000"

  labels:
    app: sre-demo-app

spec:
  selector:
    app: sre-demo-app

  ports:
    - name: http
      port: 5000
      targetPort: 5000

  type: ClusterIP

