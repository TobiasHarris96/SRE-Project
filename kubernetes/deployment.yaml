apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-demo-app
  namespace: sre-project
spec:
  replicas: 2

  selector:
    matchLabels:
      app: sre-demo-app

  template:
    metadata:
      labels:
        app: sre-demo-app

    spec:
      containers:
        - name: sre-demo-app
          image: sre-observability-app:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
